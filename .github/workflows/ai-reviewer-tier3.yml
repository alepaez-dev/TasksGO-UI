name: AI Reviewer Tier 3

# Autonomous, agentic deep review. Triggered only when a maintainer applies
# the `ai-reviewer-tier3` label; re-runs on new commits while it is present. Independent of Tier 2
# (`ai-reviewer`): its own comment namespace, its own sticky status, its own resolve-threads.
# The review only runs once the watched CI checks succeed (see "Gate on CI success"); adding the
# `ai-reviewer-tier3-force` label bypasses that gate for the current head.
#
# SECURITY MODEL (read before editing the trigger):
#   - Uses `pull_request_target`, so it has the ANTHROPIC_API_KEY secret + write to post comments.
#   - Gated by the `ai-reviewer-tier3` label PLUS a guard step requiring the triggering user to be on
#     an ALLOW-LIST (and, on `labeled`, to have write/admin). The allow-list applies to label events AND
#     to push/reopen auto re-runs, so only a listed user can ever cause a paid run. A trusted
#     `author_association` clause in the job `if:` is a cheap pre-filter on auto re-runs.
#   - DIVERGENCE FROM TIER 2: this reviewer must READ the PR head (read_file/grep/list_dir), so it
#     checks the head out into `_head` READ-ONLY and NEVER executes it — no `npm ci`, no build, no
#     PR-controlled scripts on head, and `persist-credentials: false`. Tier 3's OWN script + deps come
#     from the trusted base checkout and install with `--ignore-scripts`. The reviewer's tools are
#     read-only, repo-confined, and have no shell/network, so the secrets cannot be exfiltrated.
#   - Do NOT add a step that runs anything from `_head` (npm install, build, test, node _head/...).

on:
  pull_request_target:
    types: [labeled, synchronize, reopened]

permissions:
  contents: write # resolveReviewThread needs write; safe — head is checked out read-only & never executed (ai-reviewer-guard.yml)
  pull-requests: write # post review comments
  checks: read # the CI-success gate + the reviewer's CI-results block read check-run conclusions

concurrency:
  group: ai-reviewer-tier3-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      (github.event.action == 'labeled' &&
       contains(fromJSON('["ai-reviewer-tier3", "ai-reviewer-tier3-force"]'), github.event.label.name) &&
       contains(github.event.pull_request.labels.*.name, 'ai-reviewer-tier3')) ||
      (github.event.action != 'labeled' &&
       contains(github.event.pull_request.labels.*.name, 'ai-reviewer-tier3') &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # Only an allow-listed user may trigger Tier 3 — on a `labeled` event OR on a push/reopen while the
      # label is present (so even auto re-runs are gated on the person who pushed). On `labeled` they must
      # also have write access. Runs first (before checkout/install) so a disallowed trigger fails in ~2s
      # with zero Claude spend.
      - name: Require an allow-listed trigger
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // GitHub usernames permitted to trigger this paid review. Add more logins to widen it.
            const ALLOWLIST = ['alepaez-dev'];
            const actor = context.payload.sender?.login;
            if (!ALLOWLIST.includes(actor)) {
              core.setFailed(
                `@${actor} is not on the ai-reviewer-tier3 allow-list (${ALLOWLIST.join(', ')}). ` +
                  `Only an allow-listed user can trigger this review.`,
              );
              return;
            }
            if (context.payload.action === 'labeled') {
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: actor,
              });
              if (!['admin', 'write'].includes(data.permission)) {
                core.setFailed(`@${actor} has '${data.permission}' permission; write access is required to trigger a run.`);
              }
            }

      # Base checkout (TRUSTED)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Gate on CI success
        id: ci_gate
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          WAIT_FOR: guard,validate,a11y,e2e
          WAIT_TIMEOUT_MS: '720000'
          # ci.yml runs only on PRs targeting main (branches: [main]), so on a STACKED PR its checks
          # never exist at all (intentional).
          APPEAR_GRACE_MS: '180000'
        with:
          script: |
            const { classifyChecks, decideGate } = require(`${process.env.GITHUB_WORKSPACE}/.github/ai-reviewer-tier3/gate.cjs`);
            const wanted = process.env.WAIT_FOR.split(',').map((s) => s.trim()).filter(Boolean);
            const deadline = Date.now() + Number(process.env.WAIT_TIMEOUT_MS);
            const appearDeadline = Date.now() + Number(process.env.APPEAR_GRACE_MS);
            const seen = new Set();
            let droppedLogged = false;
            const pr = context.payload.pull_request;
            const ref = pr.head.sha;
            const short = ref.slice(0, 7);
            const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
            // A skipped gate must be visible where the maintainer is looking (the PR)
            const MARKER = '<!-- ai-reviewer-tier3-gate v1 -->';
            const findGateComment = async () => {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner, repo: context.repo.repo, issue_number: pr.number, per_page: 100,
              });
              return comments.find((c) => c.user?.type === 'Bot' && c.body?.includes(MARKER)) ?? null;
            };
            const upsertGateComment = async (body, { onlyIfExists = false } = {}) => {
              try {
                const existing = await findGateComment();
                const full = `${body}\n${MARKER}`;
                if (existing) {
                  await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body: full });
                } else if (!onlyIfExists) {
                  await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: pr.number, body: full });
                }
              } catch (e) {
                core.warning(`Could not update the gate status comment: ${e.message}`);
              }
            };
            const skip = async (why) => {
              core.notice(`Skipping the paid review at ${short}: ${why}`);
              await upsertGateComment(
                `⏸️ **Tier 3 review skipped** at \`${short}\` — ${why}\n\n` +
                  'It runs automatically on the next push once CI is green. To run it now: add the `ai-reviewer-tier3-force` label to bypass this gate, ' +
                  'or re-run the failed CI and then remove and re-add the `ai-reviewer-tier3` label (re-adding a label that is already present fires no event).',
              );
              core.setOutput('proceed', 'false');
            };
            const pass = async (why) => {
              core.info(why);
              // Refresh an earlier skip notice so the PR does not keep claiming "skipped".
              await upsertGateComment(`▶️ **Tier 3 gate passed** at \`${short}\` — ${why}`, { onlyIfExists: true });
              core.setOutput('proceed', 'true');
            };
            const labels = (pr.labels ?? []).map((l) => l?.name).filter(Boolean);
            if (labels.includes('ai-reviewer-tier3-force')) {
              await pass('the ai-reviewer-tier3-force label is present — CI gate bypassed.');
              return;
            }
            for (;;) {
              let runs;
              try {
                runs = await github.paginate(github.rest.checks.listForRef, {
                  owner: context.repo.owner, repo: context.repo.repo, ref, per_page: 100,
                });
              } catch (e) {
                // The gate is a cost heuristic, not a security control — it must never take the
                // reviewer down. Fail OPEN: review without the gate, like before the gate existed.
                core.warning(`Could not read check runs (${e.message}) — running the review without the CI gate.`);
                core.setOutput('proceed', 'true');
                return;
              }
              const states = classifyChecks(runs, wanted);
              for (const [n, s] of states) if (s !== 'absent') seen.add(n);
              const d = decideGate({ states, seen, graceExpired: Date.now() > appearDeadline, timedOut: Date.now() > deadline });
              if (d.dropped.length && !droppedLogged) {
                droppedLogged = true;
                core.info(`Not triggered for this PR (base branch filters?): ${d.dropped.join(', ')} — gating on the rest.`);
              }
              if (d.action === 'skip') {
                await skip(d.reason);
                return;
              }
              if (d.action === 'pass') {
                await pass(d.reason);
                return;
              }
              core.info(d.reason);
              await sleep(20000);
            }

      # Head checkout (UNTRUSTED) into _head — read ONLY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.ci_gate.outputs.proceed == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: _head
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.ci_gate.outputs.proceed == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            .github/ai-reviewer-tier3/package-lock.json
            .github/ai-reviewer/package-lock.json

      - name: Install reviewer dependencies (base only)
        if: steps.ci_gate.outputs.proceed == 'true'
        working-directory: .github/ai-reviewer-tier3
        run: npm ci --ignore-scripts

      - name: Install Tier 2 reviewer dependencies (imported by the Tier 3 agent)
        if: steps.ci_gate.outputs.proceed == 'true'
        working-directory: .github/ai-reviewer
        run: npm ci --ignore-scripts

      - name: Run AI tier 3 review
        if: steps.ci_gate.outputs.proceed == 'true'
        working-directory: .github/ai-reviewer-tier3
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_DIR: ${{ github.workspace }}/_head
          # The `ai-reviewer-tier3-max` label runs a deep thorough pass for large/important PRs: it bumps
          # effort high→max AND the cost ceiling $2→$3
          REVIEWER_EFFORT: ${{ contains(github.event.pull_request.labels.*.name, 'ai-reviewer-tier3-max') && 'max' || '' }}
          REVIEWER_COST_CEILING: ${{ contains(github.event.pull_request.labels.*.name, 'ai-reviewer-tier3-max') && '3' || '' }}
        run: node review-agent.mjs
